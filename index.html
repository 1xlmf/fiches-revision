<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFDF9">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Solstice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Mise en page : colonne centrale de 1120px, cartes en verre sur fond sable à halos chauds,
   navigation flottante en pilule (5 vues). Éditeur : source/OCR à gauche, fiche modifiable à droite
   sur PC ; onglets Source / Fiche sur mobile. Palette : sable, encre bleu nuit, 5 dégradés de matières. */
:root{
  --bg:#FFFDF9; --fg:#1B2233; --muted:#5B6478;
  --card:rgba(255,255,255,.64); --edge:rgba(255,255,255,.65); --line:rgba(27,34,51,.11); --chip:rgba(27,34,51,.06);
  --shadow:rgba(255,107,107,.22);
  --halo-a:rgba(255,107,107,.22); --halo-b:rgba(251,191,36,.26); --halo-c:rgba(34,211,238,.20);
  --good:#0E9F6E; --bad:#D92D3A; --warn:#B45309; --mark:rgba(251,191,36,.5); --focus:#0891B2;
  --g1:#FF6B6B; --g2:#FF8E53; --on:#2B1010;
  --r:22px; --spring:cubic-bezier(.34,1.56,.64,1);
  --f-ui:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:var(--f-ui);
  --f-code:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1120; --fg:#E8EDF7; --muted:#9AA6BD;
    --card:rgba(30,41,59,.7); --edge:rgba(255,255,255,.09); --line:rgba(255,255,255,.11); --chip:rgba(255,255,255,.07);
    --shadow:rgba(0,0,0,.5);
    --halo-a:rgba(255,107,107,.16); --halo-b:rgba(251,191,36,.10); --halo-c:rgba(34,211,238,.14);
    --good:#34D399; --bad:#F87171; --warn:#FBBF24; --mark:rgba(251,191,36,.32); --focus:#22D3EE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1120; --fg:#E8EDF7; --muted:#9AA6BD;
  --card:rgba(30,41,59,.7); --edge:rgba(255,255,255,.09); --line:rgba(255,255,255,.11); --chip:rgba(255,255,255,.07);
  --shadow:rgba(0,0,0,.5);
  --halo-a:rgba(255,107,107,.16); --halo-b:rgba(251,191,36,.10); --halo-c:rgba(34,211,238,.14);
  --good:#34D399; --bad:#F87171; --warn:#FBBF24; --mark:rgba(251,191,36,.32); --focus:#22D3EE;
  color-scheme:dark;
}
.g0{--g1:#FF6B6B;--g2:#FF8E53;--on:#2B1010}
.g1{--g1:#06B6D4;--g2:#22D3EE;--on:#032A31}
.g2{--g1:#F59E0B;--g2:#FBBF24;--on:#3A2300}
.g3{--g1:#10B981;--g2:#34D399;--on:#03301F}
.g4{--g1:#8B5CF6;--g2:#EC4899;--on:#FFFFFF}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 132px;
  background:var(--bg);color:var(--fg);
  font:500 15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60% 45% at 6% 0%,var(--halo-a),transparent 70%),
    radial-gradient(50% 40% at 100% 14%,var(--halo-b),transparent 70%),
    radial-gradient(60% 50% at 72% 100%,var(--halo-c),transparent 70%);}
body.focus{padding-block:70px 40px}
body.focus .topbar,body.focus .nav{display:none}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(24px,5vw,36px)} h2{font-size:20px} h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;transition:transform .35s var(--spring),box-shadow .2s,background .2s,opacity .2s}
button:active{transform:scale(.95)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.glass{background:var(--card);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid var(--edge);border-radius:var(--r);box-shadow:0 14px 34px -16px var(--shadow)}
.gbg{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on)}

/* Barre du haut */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em;min-width:0}
.brand span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand svg{flex:none}
.tools{display:flex;gap:8px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:15px;display:grid;place-items:center}

/* Navigation flottante (5 vues) */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  width:min(560px,calc(100% - 24px));z-index:20;padding:5px;border-radius:999px;display:grid;grid-template-columns:repeat(var(--n,4),1fr);
  background:var(--card);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid var(--edge);box-shadow:0 18px 40px -14px var(--shadow)}
.nav button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;border-radius:999px;font-size:11px;font-weight:700;color:var(--muted);min-width:0}
.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav svg{width:21px;height:21px}
.nav button[aria-current="page"]{color:#2B1010}
.ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/var(--n,4));border-radius:999px;background:linear-gradient(135deg,#FF6B6B,#FF8E53);transition:transform .55s var(--spring),opacity .2s;box-shadow:0 8px 18px -8px #FF6B6B}
@media (min-width:700px){.nav button{flex-direction:row;justify-content:center;gap:8px;font-size:13px;padding:11px 6px}}

.view{animation:rise .5s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:30px 2px 14px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:var(--chip);font-weight:700;font-size:13px}
.chip b{font-family:var(--f-mono)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.stat{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:13px;min-height:40px}
.ghost{padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;background:var(--chip);min-height:36px}
.ghost:hover{background:var(--line)}
.ghost.gbg,.ghost.gbg:hover{background:linear-gradient(135deg,var(--g1),var(--g2))}
.primary{padding:12px 20px;border-radius:16px;font-weight:800;background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on);box-shadow:0 12px 24px -12px var(--g1);min-height:44px}
.danger{color:var(--bad)}
.hintline{font-size:13px;color:var(--muted)}

/* Hero accueil */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:24px}
.hero .sub{color:var(--muted);margin-top:8px;max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ringbox{display:grid;justify-items:center;gap:6px}
.ring{position:relative;width:104px;height:104px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--line)}
.ring .prg{transition:stroke-dashoffset 1.1s var(--spring)}
.ring .num{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:19px;line-height:1.1}
.ring .num small{font-size:10px;color:var(--muted);font-weight:500}
.goalrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.goalrow button{width:28px;height:28px;border-radius:9px;background:var(--chip);font-weight:800}
@media (max-width:560px){.hero{grid-template-columns:1fr}.ringbox{justify-items:start;grid-auto-flow:column;justify-content:start;gap:16px;align-items:center}}

/* Actions rapides */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.qa{padding:16px;display:grid;gap:10px;text-align:left;justify-items:start}
.qa:hover{transform:translateY(-3px)}
.qa .tile{width:44px;height:44px;border-radius:14px;font-size:21px}
.qa b{font-size:15px}.qa span.d{font-size:13px;color:var(--muted);font-weight:500}

.tile{display:grid;place-items:center;flex:none;border-radius:18px}
.scard,.ccard{padding:16px;display:grid;gap:12px;text-align:left;cursor:pointer;transition:transform .4s var(--spring),box-shadow .3s;align-content:start}
.scard:hover,.ccard:hover{transform:translateY(-4px)}
.scard .top,.ccard .top{display:flex;align-items:center;gap:12px;min-width:0}
.scard .tile{width:54px;height:54px;font-size:27px}
.ccard .tile{width:44px;height:44px;font-size:22px;border-radius:14px}
.nm{font-weight:800;font-size:16px;letter-spacing:-.01em;min-width:0;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted)}
.bar{height:9px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .9s var(--spring)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.newcard{border:2px dashed var(--line);display:grid;place-items:center;min-height:150px;color:var(--muted);font-weight:700;text-align:center;gap:6px;padding:18px;border-radius:var(--r)}
.newcard:hover{border-color:var(--g1);color:var(--fg)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:3px 10px;border-radius:99px;background:var(--chip);font-size:12px;font-weight:700;color:var(--muted)}
.st{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.st.draft{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.st.active{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.st.archived{background:var(--chip);color:var(--muted)}

/* Barre d'outils de liste */
.toolbar{padding:14px;display:grid;gap:12px;margin-bottom:14px}
.toolbar .line{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar input[type=text]{flex:1 1 220px}
select,input[type=text],input[type=date],input[type=time],input[type=number],textarea{font:inherit;color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.55}
label.f{display:grid;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{padding:8px 14px;border-radius:999px;background:var(--chip);font-weight:700;font-size:13px;min-height:36px}
.fchip[aria-pressed="true"]{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--on)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--chip);flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 4px 12px -6px var(--shadow)}
.band{padding:22px 24px;border-radius:var(--r);display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;margin-bottom:16px}
.band h1{font-size:clamp(22px,4vw,30px)} .band p{opacity:.88;font-size:14px}
.band .row{justify-content:flex-start}
.band .ghost{background:rgba(255,255,255,.3);color:inherit}
.band .ghost:hover{background:rgba(255,255,255,.45)}

/* Éditeur */
.ehead{padding:16px 18px;display:grid;gap:12px;margin-bottom:14px}
.titlein{font-size:clamp(20px,3.4vw,26px);font-weight:800;letter-spacing:-.02em;background:transparent;border:1px solid transparent;padding:6px 8px;margin:0 -8px}
.titlein:hover{border-color:var(--line)}.titlein:focus{border-color:var(--focus);background:var(--chip)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
.tagedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagedit .tag{display:inline-flex;align-items:center;gap:6px}
.tagedit .tag button{font-weight:800;line-height:1;width:18px;height:18px;border-radius:99px;background:var(--line)}
.tagedit input{width:150px;padding:6px 10px;border-radius:99px}
.saved{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px;align-items:start}
.split>*{min-width:0}
.tabsM{display:none;margin-bottom:12px}
@media (max-width:899px){
  .split{grid-template-columns:1fr}
  .tabsM{display:inline-flex}
  .split[data-tab="doc"] .p-source{display:none}
  .split[data-tab="source"] .p-doc{display:none}
}
@media (min-width:900px){.p-source{position:sticky;top:12px}}
.panel{padding:16px;display:grid;gap:12px}
#srcTA,#impText{min-height:300px;font-size:14px}
@media (min-width:900px){#srcTA{min-height:420px}}
.srcimg{max-height:220px;width:auto;max-width:100%;border-radius:14px;justify-self:start;border:1px solid var(--line)}
.qbox{padding:10px 12px;border-radius:14px;background:var(--mark);font-size:14px;overflow-wrap:anywhere}
.qbox b{font-family:var(--f-mono);font-size:11px;display:block;margin-bottom:2px}
.blocks{display:grid;gap:10px}
.blk{padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--edge);display:grid;gap:8px;min-width:0}
.blk.t-heading{background:transparent;border:0;padding:10px 2px 0}
.blk.t-trap{background:color-mix(in srgb,var(--bad) 7%,var(--card))}
.bh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.bh .l{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.bt{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.btools{display:flex;gap:2px}
.btools button{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--muted);font-size:16px}
.btools button:hover{background:var(--chip);color:var(--fg)}
.btools button.dl:hover{color:var(--bad)}
.blk input,.blk textarea{background:transparent;border:1px solid transparent;padding:7px 9px;margin:0 -9px;width:calc(100% + 18px)}
.blk input:hover,.blk textarea:hover{border-color:var(--line)}
.blk input:focus,.blk textarea:focus{border-color:var(--focus);background:var(--chip)}
.blk.t-heading input{font-size:19px;font-weight:800;letter-spacing:-.01em}
.blk textarea{resize:none;overflow:hidden;min-height:40px}
.blk .term{font-weight:800}
.blk .mono-in{font-family:var(--f-code);font-size:14px}
.sub-l{font-size:11px;font-weight:700;color:var(--muted)}
.ref{font-family:var(--f-mono);font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;color:var(--fg);background:color-mix(in srgb,var(--g1) 18%,transparent);border:1px solid color-mix(in srgb,var(--g1) 40%,transparent);min-height:28px}
.ref:hover{background:color-mix(in srgb,var(--g1) 30%,transparent)}
.addbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-radius:18px;border:2px dashed var(--line);align-items:center}
.addbar .l{font-size:12px;font-weight:800;color:var(--muted);margin-right:4px}

/* Import */
.dropzone{border:2px dashed var(--line);border-radius:18px;padding:18px;text-align:center;display:grid;gap:8px;justify-items:center;transition:transform .35s var(--spring),border-color .2s,background .2s}
.dropzone.over{border-color:var(--g1);background:var(--chip);transform:scale(1.015)}
.dropzone svg{width:30px;height:30px;color:var(--muted)}
.dropzone .small{font-size:13px;color:var(--muted)}
.prog{height:8px;border-radius:99px;background:var(--chip);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .3s}
.note{padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--warn) 14%,transparent);font-size:13px}
.checks{display:grid;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--g1)}
.check small{display:block;color:var(--muted);font-weight:500;font-size:12px}

/* Planning */
.slist{list-style:none;margin:0;padding:6px;display:grid}
.srow{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 10px;border-radius:16px}
.srow+.srow{border-top:1px solid var(--line)}
.srow.done .sttl{text-decoration:line-through;color:var(--muted)}
.sdate{display:grid;gap:2px;font-size:13px}.sdate span{color:var(--muted);font-size:12px}
.sdate.late b{color:var(--bad)}
.sttl{font-weight:800;overflow-wrap:anywhere}
.smeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.sacts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.srow{grid-template-columns:1fr;gap:8px}.sacts{justify-content:flex-start}.sdate{display:flex;gap:10px;align-items:baseline}}
.lvl{display:flex;align-items:center;gap:8px;margin:22px 2px 10px}
.lvl h2{font-size:17px}
.lvl .badge{background:var(--chip)}
.lvl.late h2{color:var(--bad)}

/* Révision */
.setup{padding:20px;display:grid;gap:18px;max-width:720px;margin:0 auto}
.setup .label{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:8px;letter-spacing:.04em;text-transform:uppercase}
.topprog{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:7px;z-index:30;background:var(--chip)}
.topprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:0 99px 99px 0;transition:width .6s var(--spring)}
.fbar{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:720px;margin:0 auto 14px}
.stage{max-width:720px;margin:0 auto;display:grid;gap:18px}
.scene{perspective:1000px;border-radius:var(--r)}
.card3d{display:grid;position:relative;transform-style:preserve-3d;transition:transform .75s var(--spring);cursor:pointer;outline-offset:6px}
.card3d.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;-webkit-backface-visibility:hidden;backface-visibility:hidden;min-height:320px;padding:24px;display:grid;align-content:space-between;gap:16px}
.face.back{transform:rotateY(180deg)}
.face .q{font-size:clamp(19px,3.6vw,25px);font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere;text-wrap:balance}
.face .a{font-size:clamp(17px,3vw,21px);font-weight:700;white-space:pre-line;overflow-wrap:anywhere}
.face .tip{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.face .hint{font-size:14px;color:var(--muted)}
.fhd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;transition:opacity .3s}

.toast.on.has-act{pointer-events:auto}

body.focus .toast{bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(11,17,32,.45);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.modal{width:min(580px,100%);max-height:calc(100% - 8px);overflow:auto;padding:22px;display:grid;gap:14px;background:var(--bg);border:1px solid var(--edge);border-radius:var(--r);animation:rise .45s var(--spring) both}

/* Hub Apprendre, vidéo, rappel actif */

.ltabs button[aria-pressed="true"]{background:linear-gradient(135deg,#FF6B6B,#FF8E53);color:#2B1010;box-shadow:0 8px 18px -10px #FF6B6B}
.vid{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--chip);border:1px solid var(--line)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13px;color:var(--muted)}
#vTr{min-height:140px}
.studybar{padding:14px 16px;display:grid;gap:10px;margin-bottom:4px}
.sh{font-size:19px;padding:10px 2px 0}
.cloze{font:inherit;font-weight:700;color:transparent;background:color-mix(in srgb,var(--g1) 24%,var(--chip));border-radius:8px;padding:0 6px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .25s,color .25s,transform .35s var(--spring)}

.cloze.on{color:var(--fg);background:color-mix(in srgb,var(--good) 20%,transparent);animation:pop2 .45s var(--spring)}
@keyframes pop2{0%{transform:scale(.85)}100%{transform:none}}
.blk p{margin:0;overflow-wrap:anywhere}
.blk .formula{font-family:var(--f-code);font-size:14px;padding:10px 12px;border-radius:14px;background:var(--chip);overflow-wrap:anywhere}

/* Animations */
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.95)}to{opacity:1;transform:none}}
.grid>*,.quick>*,.slist>li,.blocks.enter>*,.ltabs,.studybar{animation:pop .6s var(--spring) both;animation-delay:calc(var(--i,0)*55ms)}
.bar i{transform-origin:left;animation:grow 1s var(--spring) both}
@keyframes grow{from{transform:scaleX(0)}}
.brand svg{animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flame{display:inline-block;transform-origin:50% 90%;animation:flame 1.8s ease-in-out infinite}

.nav button[aria-current="page"] svg{animation:navpop .6s var(--spring)}

.scard{will-change:transform}
.qa .tile{transition:transform .5s var(--spring)}
.qa:hover .tile{transform:rotate(-8deg) scale(1.12)}

<script>
/* =======================================================================
   SOLSTICE : application de révision centrée sur les cours.
   Fichier unique, aucune étape de build. Tout est enregistré dans le navigateur.

   BRANCHER UN VRAI MOTEUR (facultatif) : définir avant ce script
     (dans une balise script placée avant celle-ci)
       window.SOLSTICE_CONFIG = {
         // OCR : une de ces deux options (sinon Tesseract.js dans le navigateur, puis mode démo)
         ocr:    async (file, onProgress) => "texte lu",          // fonction personnalisée
         ocrUrl: "/api/ocr",                                        // POST multipart "file" -> { "text": "…" }
         // Génération par IA : doit renvoyer le même objet que generateLocal()
         // (plan, resume, idees, definitions, formules, pieges, cards ; chaque élément avec "quote")
         generate: async (text, { mode }) => ({ … })
       };
   Toute réponse d'IA passe par groundFilter() : un élément dont l'extrait "quote" est introuvable
   dans le texte source est supprimé, donc rien d'inventé n'entre dans une fiche.
   ======================================================================= */
(() => {
'use strict';
const CFG = window.SOLSTICE_CONFIG || {};

/* ===== 1. Utilitaires ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const DAY = 864e5, KEY = 'solstice-v2';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clip = (s, n) => s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s;
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const keyOff = n => { const d = new Date(); d.setDate(d.getDate() + n); return dkey(d); };
const todayKey = () => keyOff(0);
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const diffDays = k => Math.round((parseKey(k) - parseKey(todayKey())) / DAY);
const fmtDate = k => parseKey(k).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
const relDay = k => { const d = diffDays(k); return d === 0 ? "Aujourd'hui" : d === 1 ? 'Demain' : d === -1 ? 'Hier' : fmtDate(k); };
const fmtShort = ts => new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clone = o => JSON.parse(JSON.stringify(o));
const GRAD = [{ n: 'Corail Solaire', c: ['#FF6B6B', '#FF8E53'] }, { n: 'Turquoise Lagon', c: ['#06B6D4', '#22D3EE'] }, { n: 'Mangue Agrume', c: ['#F59E0B', '#FBBF24'] }, { n: 'Menthe Palmier', c: ['#10B981', '#34D399'] }, { n: 'Couché de soleil', c: ['#8B5CF6', '#EC4899'] }];

/* ===== 2. Génération ancrée (extraction : seuls les extraits présents dans le cours sont repris) ===== */
const NA = '[Non précisé dans le cours]';
const STOP = new Set(('les des une est que qui dans pour avec sur par aux ses son sa ce cette ces pas plus mais donc ainsi comme sont être avoir fait peut tout elle ils elles nous vous leur leurs entre sans sous dont aussi alors lors chaque afin cela celui celle car très selon puis après avant même autre autres ont aux').split(' '));
const wordsOf = s => (s.toLowerCase().match(/[\p{L}\p{N}]{3,}/gu) || []).filter(w => !STOP.has(w));
const freqOf = t => { const f = {}; wordsOf(t).forEach(w => { f[w] = (f[w] || 0) + 1; }); return f; };
const normT = s => s.replace(/[’‘]/g, "'").replace(/[“”«»]/g, '"').replace(/\s+/g, ' ').trim().toLowerCase();
const isGrounded = (quote, src) => !!quote && normT(src).includes(normT(quote));
const PAGE_RE = /^-{2,}\s*Page\s+(\d+)\s*-{2,}$/i;

function parseLines(text) {
  const out = []; let pos = 0, page = null, para = 1, prevBlank = true;
  for (const raw of text.split('\n')) {
    const start = pos; pos += raw.length + 1;
    const t = raw.trim(), pm = t.match(PAGE_RE);
    if (pm) { page = +pm[1]; continue; }
    if (!t) { if (!prevBlank) para++; prevBlank = true; continue; }
    prevBlank = false;
    const hm = t.match(/^#{1,4}\s+(.+)$/), tm = !hm && t.match(/^\[(\d{1,2}(?::\d{2}){1,2})\]\s+(.+)$/);
    out.push({ t: hm ? hm[1].trim() : tm ? tm[2].trim() : t, head: !!hm, time: tm ? tm[1] : '', start: start + raw.indexOf(t) + (tm ? t.length - tm[2].length : 0), page, para });
  }
  return out;
}
function sentencesOf(line) {
  const out = [], re = /(?:[^.!?]|[.!?](?!\s|$))+(?:[.!?]+(?=\s|$)|$)/g; let m;
  while ((m = re.exec(line.t))) { const t = m[0].trim(); if (t) out.push({ t, line }); }
  return out;
}
function cloze(sentence, freq) {
  const c = (sentence.match(/[\p{L}\p{N}]{6,}/gu) || []).filter(w => !STOP.has(w.toLowerCase()));
  if (!c.length) return null;
  c.sort((a, b) => (freq[b.toLowerCase()] || 0) - (freq[a.toLowerCase()] || 0) || b.length - a.length);
  const k = c[0], i = sentence.indexOf(k);
  return { q: 'Complète : ' + sentence.slice(0, i) + '[…]' + sentence.slice(i + k.length), a: k, explain: sentence };
}
/* Résumé extractif TextRank : les phrases les plus « centrales » du cours, reprises mot pour mot */
function textRank(cands) {
  const n = cands.length; if (n < 2) return cands.map(() => 1);
  const sets = cands.map(c => new Set(c.w));
  if (n > 400) return sets.map(x => x.size);
  const sim = (i, j) => { let k = 0; sets[i].forEach(w => { if (sets[j].has(w)) k++; }); const d = Math.log(sets[i].size + 1) + Math.log(sets[j].size + 1); return d ? k / d : 0; };
  const W = Array.from({ length: n }, () => new Array(n).fill(0));
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) W[i][j] = W[j][i] = sim(i, j);
  const out = W.map(r => r.reduce((a, b) => a + b, 0));
  let r = new Array(n).fill(1 / n);
  for (let it = 0; it < 30; it++) r = r.map((_, i) => .15 / n + .85 * W.reduce((a, row, j) => a + (out[j] > 0 ? row[i] / out[j] * r[j] : 0), 0));
  return r;
}
/* Mots-clés : fréquence, majuscules, position et répartition dans le cours (même esprit que YAKE) */
function keywordsOf(text, defs) {
  const tf = {}, caps = {}, first = {}, spread = {}, surf = {}; let si = 0;
  parseLines(text).forEach(l => { if (l.head) return; sentencesOf(l).forEach(s => {
    (s.t.match(/\p{L}[\p{L}\p{N}'’-]{3,}/gu) || []).forEach((w, k) => {
      const lw = w.toLowerCase(); if (STOP.has(lw)) return;
      tf[lw] = (tf[lw] || 0) + 1; if (k > 0 && /^\p{Lu}/u.test(w)) caps[lw] = (caps[lw] || 0) + 1;
      if (first[lw] === undefined) first[lw] = si; (spread[lw] = spread[lw] || new Set()).add(si); if (!surf[lw]) surf[lw] = w;
    }); si++;
  }); });
  const sc = Object.keys(tf).map(w => ({ w, s: (1 + (caps[w] || 0)) * tf[w] * (1 + 1 / Math.log(2.7 + first[w])) * Math.sqrt(spread[w].size) })).sort((a, b) => b.s - a.s);
  const out = [], seen = new Set();
  const push = m => { const k = m.toLowerCase(); if (!seen.has(k) && out.length < 8) { seen.add(k); out.push({ mot: m, quote: m }); } };
  defs.slice(0, 5).forEach(d => { if (d.terme.length <= 40) push(d.terme); });
  sc.forEach(x => { if (tf[x.w] >= 2 || out.length < 4) push(surf[x.w]); });
  return out;
}
function generateLocal(text, o = {}) {
  const maxCards = o.maxCards || 8;
  const lines = parseLines(text), used = new Set(), freq = freqOf(text);
  const ref = l => l.time ? '▶ ' + l.time : l.page ? 'Page ' + l.page : 'Passage ' + l.para;
  const STEP = /^(?:\d+\s*[.)]|[ée]tape\s*\d+\s*[:.)]?)\s*/i;
  const BLACK = /^(exemples?|attention|piège|pièges|formules?|étapes?|remarques?|note|important|rappel|méthodes?|définitions?|conclusion|à retenir|astuce)$/i;
  lines.forEach((l, i) => { if (l.head) used.add(i); });

  let titre = '';
  if (lines.length && !lines[0].head) {
    const f = lines[0].t;
    if (f.length < 100 && !/[.!?]$/.test(f) && (/chapitre|cours|leçon|fiche|module|—|–/i.test(f) || !f.includes(':'))) { titre = f; used.add(0); }
  }
  let heads = lines.filter(l => l.head);
  if (!heads.length) { // repli : lignes courtes qui ressemblent à un intertitre
    lines.forEach((l, i) => {
      const nx = lines[i + 1];
      if (used.has(i) || STEP.test(l.t) || l.t.length < 3 || l.t.length > 70 || /[:=.!?;,]/.test(l.t) || !/^\p{Lu}/u.test(l.t) || l.t.split(/\s+/).length > 9 || !nx || nx.head) return;
      heads.push(l); used.add(i);
    });
  }
  const plan = heads.map(l => ({ texte: l.t, ref: ref(l), quote: l.t }));

  const formules = [];
  for (let i = 0; i < lines.length; i++) {
    if (used.has(i) || !STEP.test(lines[i].t)) continue;
    let j = i; const steps = [];
    while (j < lines.length && STEP.test(lines[j].t)) { steps.push(lines[j].t.replace(STEP, '')); j++; }
    if (steps.length >= 2) {
      for (let k = i; k < j; k++) used.add(k);
      let ttl = 'Méthode';
      const head = i > 0 && !used.has(i - 1) ? lines[i - 1] : null;
      if (head && /:\s*$/.test(head.t) && head.t.split(/\s+/).length <= 14) { ttl = head.t.replace(/\s*:\s*$/, ''); used.add(i - 1); }
      formules.push({ titre: ttl, contenu: steps.map((s, k) => (k + 1) + '. ' + s).join('\n'), ref: ref(lines[i]), quote: lines[i].t, pos: lines[i].start });
    }
    i = j - 1;
  }
  lines.forEach((l, i) => {
    if (used.has(i) || !/[=≈∝]/.test(l.t) || l.t.length > 140) return;
    const m = l.t.match(/^([^:=]{3,70}?)\s*:\s*(.+)$/), ok = m && /[=≈∝]/.test(m[2]);
    formules.push({ titre: ok ? m[1] : 'Formule', contenu: ok ? m[2] : l.t, ref: ref(l), quote: l.t, pos: l.start });
    used.add(i);
  });
  formules.sort((a, b) => a.pos - b.pos);

  const pieges = [];
  const P_START = /^(attention|piège|erreur|à éviter|évite|ne pas confondre|ne jamais|n'oubliez|ne pas oublier|danger)/i;
  const P_ANY = /(erreurs? (?:la plus )?fréquentes?|piège|à éviter|ne pas confondre|confond)/i;
  lines.forEach((l, i) => {
    if (used.has(i) || l.t.length > 320) return;
    if (P_START.test(l.t) || P_ANY.test(l.t)) { pieges.push({ texte: l.t, ref: ref(l), quote: l.t }); used.add(i); }
  });

  const definitions = [], seen = new Set();
  const addDef = (terme, definition, l, quote) => { const k = terme.toLowerCase(); if (seen.has(k)) return; seen.add(k); definitions.push({ terme, definition, ref: ref(l), quote }); };
  lines.forEach((l, i) => {
    if (used.has(i)) return;
    const m = l.t.match(/^(?:[-•*]\s*)?([A-ZÀ-Ý][^:.!?]{1,64}?)\s*:\s+(.{18,})$/u);
    if (!m) return;
    const term = m[1].trim();
    if (term.split(/\s+/).length > 7 || BLACK.test(term) || /\s(est|sont|a|ont)\s/.test(term)) return;
    addDef(term, m[2].trim(), l, l.t); used.add(i);
  });
  lines.forEach(l => {
    if (l.head) return;
    sentencesOf(l).forEach(s => {
      const m = s.t.match(/^On appelle\s+(.{3,60}?)\s+((?:une?|la|le|les|l'|des|du)\s.{15,})$/iu);
      if (m) addDef(m[1].trim().replace(/^./, c => c.toUpperCase()), m[2].trim(), l, s.t);
    });
  });
  if (definitions.length < 3) {
    lines.forEach((l, i) => {
      if (used.has(i)) return;
      sentencesOf(l).forEach(s => {
        const m = s.t.match(/^(?:Le|La|Les|L'|Un|Une)\s?([^,.:;!?()]{2,50}?)\s+(?:est|sont|désigne|désignent|correspond à|se définit comme|consiste à|signifie)\s+(.{25,})$/u);
        if (m && definitions.length < 8 && m[1].split(/\s+/).length <= 5 && !/\d/.test(m[1])) addDef(m[1].trim().replace(/^./, c => c.toUpperCase()), m[2].trim(), l, s.t);
      });
    });
  }

  const listes = [], BUL = /^[-•–*]\s+\S/;
  for (let i = 0; i < lines.length; i++) {
    if (used.has(i) || !BUL.test(lines[i].t)) continue;
    let j = i; const its = [];

function kwRegex(e) {

  if (!kws.length) return null;
  try { return new RegExp('(?<![\\p{L}\\p{N}])(' + kws.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![\\p{L}\\p{N}])', 'giu'); } catch (x) { return null; }

  return out + esc(t.slice(last));
}

function blockOp(op, bid, t) {
  const { e } = curEnt(); if (!e) return; const i = e.blocks.findIndex(b => b.id === bid), y = scrollY;
  if (op === 'add') { const b = newBlock(t); e.blocks.push(b); touch(e); paintBlocks(); const el = $(`[data-bid="${b.id}"] input,[data-bid="${b.id}"] textarea`); el && el.focus(); return; }

  else if (op === 'down' && i < e.blocks.length - 1) [e.blocks[i + 1], e.blocks[i]] = [e.blocks[i], e.blocks[i + 1]];

function act(a, el, ev) {

    case 'vid-load': prepareVideo(); break;
    case 'vid-auto': { const id = videoId(UI.imp.videoUrl); if (!id) { toast('Colle d\'abord le lien de la vidéo.'); break; } Promise.resolve(CFG.transcript(id)).then(raw => prepareVideo(raw)).catch(() => toast('Transcription introuvable pour cette vidéo.')); break; }
    case 'learn-tab': UI.open.course = ''; UI.open.sheet = ''; if (d.t === 'videos') { UI.f.cours.src = 'video'; go('cours'); } else if (d.t === 'cours') { UI.f.cours.src = 'all'; go('cours'); } else go(d.t); break;
    case 'recall': UI.recall = !UI.recall; render(); break;
    case 'reveal': el.classList.toggle('on'); break;
    case 'reveal-all': $$('#blocks .cloze').forEach(c => c.classList.add('on')); break;
    case 'mask-all': $$('#blocks .cloze').forEach(c => c.classList.remove('on')); break;
    case 'speak': {
      if (!('speechSynthesis' in window)) { toast('Lecture audio indisponible ici.'); break; }
      if (UI.speaking) { speechSynthesis.cancel(); UI.speaking = false; paintBlocks(); break; }
      const { e } = curEnt(), txt = e.blocks.map(b => b.type === 'heading' ? b.text + '.' : [b.term, b.def, b.title, b.content, b.text, b.q, b.a].filter(Boolean).join('. ')).join('\n');
      const u = new SpeechSynthesisUtterance(txt); u.lang = 'fr-FR'; u.onend = u.onerror = () => { UI.speaking = false; if (UI.recall) paintBlocks(); }; UI.speaking = true; speechSynthesis.speak(u); paintBlocks(); break;
    }
    case 'pick-file': $('#fileIn').click(); break;
    case 'pick-cam': $('#camIn').click(); break;
    case 'imp-create': createFromImport(); break;
    /* planning */
    case 'sch-new': openSched(); break;
    case 'sch-chip': { const m = UI.modal; m.time = $('#schH').value; m.chip = d.v; if (d.v !== 'c') m.date = keyOff(+d.v); m.target = $('#schT').value; paintModal(); if (d.v === 'c') $('#schD').focus(); break; }
    case 'sch-freq': { const m = UI.modal; m.time = $('#schH').value; m.date = $('#schD').value || m.date; m.target = $('#schT').value; m.freq = d.v; paintModal(); break; }
    case 'sch-save': {
      const m = UI.modal, date = $('#schD').value, time = $('#schH').value; if (!date) { toast('Choisis une date.'); break; }
      if (m.id) { const sc = S.sched.find(x => x.id === m.id); sc.date = date; sc.time = time; toast('Révision replanifiée.'); }
      else {
        const [kind, tid] = $('#schT').value.split(':'); if (!tid) { toast('Choisis quoi réviser.'); break; }
        const plus = n => { const x = parseKey(date); x.setDate(x.getDate() + n); return dkey(x); };
        if (m.freq === 'spaced') [0, 3, 7].forEach((n, i) => S.sched.push({ id: uid(), kind, tid, date: plus(n), time, freq: 'once', note: `Rappel ${i + 1}/3`, done: false }));
        else S.sched.push({ id: uid(), kind, tid, date, time, freq: m.freq, note: '', done: false });
        toast(m.freq === 'spaced' ? '3 rappels programmés.' : 'Révision programmée.');
      }
      save(); closeModal(); render(); break;
    }
    case 'sch-edit': { const sc = S.sched.find(x => x.id === d.id); openSched({ id: sc.id, target: `${sc.kind}:${sc.tid}`, date: sc.date, time: sc.time, freq: sc.freq }); break; }
    case 'sch-done': { const sc = S.sched.find(x => x.id === d.id); markDone(sc); save(); toast(sc.freq === 'weekly' ? 'Fait. Prochain rappel dans 7 jours.' : 'Marquée comme faite.'); render(); confetti(45); break; }
    case 'sch-undone': { const sc = S.sched.find(x => x.id === d.id); sc.done = false; save(); render(); break; }
    case 'sch-del': {
      if (UI.confirm !== 'sch' + d.id) { UI.confirm = 'sch' + d.id; render(); setTimeout(() => { if (UI.confirm === 'sch' + d.id) { UI.confirm = ''; render(); } }, 3500); break; }
      S.sched = S.sched.filter(x => x.id !== d.id); UI.confirm = ''; save(); render(); break;
    }
    case 'sch-run': { const sc = S.sched.find(x => x.id === d.id); const list = startFor(sc.kind, sc.tid); if (!list.length) { toast('Aucune carte à réviser dans cet élément. Ajoute des définitions ou des flashcards à une fiche active.'); break; } startSession(list, { mode: UI.rev.mode, scope: list.some(isDueIt) ? 'dues' : 'all', schId: sc.id }); break; }
    /* révision */
    case 'rev-now': startSession(items(), { mode: UI.rev.mode, scope: 'dues' }); break;
    case 'rev-subj': UI.rev.subjectId = d.id; render(); break;
    case 'rev-mode': UI.rev.mode = d.m; render(); break;
    case 'rev-scope': UI.rev.scope = d.s; render(); break;
    case 'rev-start': { const r = UI.rev; startSession(items().filter(i => (r.subjectId === 'all' || i.subjectId === r.subjectId) && (r.sheetId === 'all' || i.sheetId === r.sheetId)), { mode: r.mode, scope: r.scope }); break; }
    case 'rev-quit': endSession(); break;
    case 'rev-again': UI.rev.session = null; render(); break;
    case 'flip': flip(); break;
    case 'hint': { const h = $('#hint'); if (h) h.hidden = !h.hidden; break; }
    case 'grade': grade(+d.g); break;
    case 'quiz-pick': quizPick(+d.i); break;
    case 'quiz-next': nextCard(); break;
    case 'card-src': {
      const it = UI.rev.session && UI.rev.session.map[d.id]; if (!it) break;
      UI.rev.session = null; openEnt('sheet', it.sheetId); setTimeout(() => showSource(d.id), 80); break;
    }
    /* modales et réglages */
    case 'modal-bg': if (ev && el === ev.target) closeModal(); break;
    case 'modal-close': closeModal(); break;
    case 'set-theme': S.settings.theme = d.v; applyTheme(); save(); paintModal(); render(); break;
    case 'set-ocr': S.settings.ocr = d.v; save(); paintModal(); break;
    case 'copy-export': (navigator.clipboard ? navigator.clipboard.writeText(JSON.stringify(S)) : Promise.reject()).then(() => toast('Sauvegarde copiée.')).catch(() => toast('Copie impossible ici : utilise « Télécharger ma sauvegarde ».')); break;
    case 'dl-export': try { const u = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' })), l = document.createElement('a'); l.href = u; l.download = 'solstice-sauvegarde-' + todayKey() + '.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); toast('Téléchargement lancé. S\'il ne démarre pas, utilise « Copier ».'); } catch (e) { toast('Téléchargement impossible ici : utilise « Copier ».'); } break;
    case 'import-run': importJSON(); break;
    case 'reset-ask': if (!UI.modal.confirm) { UI.modal.confirm = true; paintModal(); break; } S = seed(); UI.open = { course: '', sheet: '' }; UI.rev.session = null; save(); applyTheme(); closeModal(); toast('Données de démonstration restaurées.'); render(); break;
  }
}
function importJSON(txt) {
  try {
    const o = JSON.parse(txt ?? $('#imp').value);
    if (!o || !Array.isArray(o.subjects) || !Array.isArray(o.courses) || !Array.isArray(o.sheets) || !o.subjects.length) throw new Error('forme');
    const b = base(); S = Object.assign(b, o, { settings: Object.assign(b.settings, o.settings || {}) });
    UI.open = { course: '', sheet: '' }; UI.rev.session = null; save(); applyTheme(); closeModal(); toast('Import réussi.'); render();
  } catch (e) { toast('JSON invalide : utilise un export Solstice.'); }
}

/* ===== 15. Événements ===== */
document.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  const c = e.target.closest && e.target.closest('.scard'); if (!c) return;
  const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
  c.style.transform = `perspective(700px) rotateX(${(-y * 7).toFixed(2)}deg) rotateY(${(x * 9).toFixed(2)}deg) translateY(-4px)`;
});
document.addEventListener('pointerout', e => { const c = e.target.closest && e.target.closest('.scard'); if (c && !c.contains(e.relatedTarget)) c.style.transform = ''; });
document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (t) act(t.dataset.act, t, e); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('textarea.auto')) autosize(t);
  if (t.dataset.bf) { const { e: en } = curEnt(), bid = t.closest('[data-bid]')?.dataset.bid, b = en && en.blocks.find(x => x.id === bid); if (b) { b[t.dataset.bf] = t.value; touch(en); } }
  else if (t.dataset.ef === 'title') { const { e: en } = curEnt(); en.title = t.value; touch(en); }
  else if (t.id === 'srcTA') { const c = ent('course', t.dataset.srcof); if (c) { c.text = t.value; touch(c); const n = $('#srcCount'); if (n) n.textContent = t.value.length + ' caractères'; } }
  else if (t.dataset.qf) { UI.f[t.dataset.qf].q = t.value; const r = $('#results'); if (r) r.innerHTML = resultsHTML(t.dataset.qf); }
  else if (t.dataset.if) {
    const k = t.dataset.if; UI.imp[k] = t.type === 'checkbox' ? t.checked : t.value;
    if (k === 'text') { clearTimeout(statsT); statsT = setTimeout(() => { const s = $('#impStats'); if (s) s.textContent = statsOf(UI.imp.text); }, 300); }
  } else if (t.id === 'setName') { S.settings.name = t.value.trim() || 'Solstice'; document.title = S.settings.name; const b = $('#brandName'); if (b) b.textContent = S.settings.name; save(); }
  else if (t.id === 'setGoal') { S.settings.goal = Math.max(1, Math.min(100, +t.value || 10)); save(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.ef && t.dataset.ef !== 'title') {
    const { kind, e: en } = curEnt(), f = t.dataset.ef; if (!en) return;
    if (f === 'status') { setStatus(kind, en.id, t.value, true); render(); return; }
    en[f] = t.value; touch(en); render();
  } else if (t.dataset.if && (t.tagName === 'SELECT' || t.type === 'checkbox')) { UI.imp[t.dataset.if] = t.type === 'checkbox' ? t.checked : t.value; if (t.dataset.if === 'subjectId') render(); }
  else if (t.id === 'archDate') { UI.f.arch.date = t.value; const r = $('#results'); if (r) r.innerHTML = resultsHTML('arch'); }
  else if (t.id === 'revSheet') { UI.rev.sheetId = t.value; render(); }
  else if (t.dataset.mod) { S.settings.mods = Object.assign({ video: true, planning: true, archives: true }, S.settings.mods || {}); S.settings.mods[t.dataset.mod] = t.checked; save(); render(); }
  else if (t.id === 'setLang') { S.settings.lang = t.value; save(); }
  else if (t.id === 'schD') { if (UI.modal) { UI.modal.date = t.value; UI.modal.chip = 'c'; $$('[data-act="sch-chip"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === 'c'))); } }
  else if (t.id === 'fileIn' || t.id === 'camIn') { ingest(t.files[0]); t.value = ''; }
  else if (t.id === 'impFile') { const f = t.files[0]; if (f) readAs(f, 'readAsText').then(x => importJSON(x)).catch(() => toast('Fichier illisible.')); }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'tagIn' && (e.key === 'Enter' || e.key === ',')) {
    e.preventDefault(); const v = e.target.value.replace(/^#/, '').trim().toLowerCase(), { e: en } = curEnt();
    if (v && en && !en.tags.includes(v)) { en.tags.push(v); touch(en); } $('#tagedit').innerHTML = tagsHTML(en); $('#tagIn').focus(); return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && (UI.view === 'cours' || UI.view === 'fiches')) { e.preventDefault(); save(); toast('Enregistré. La sauvegarde est automatique.'); return; }
  if (UI.modal) { if (e.key === 'Escape') closeModal(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag)) return;
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.scard,.ccard')) { e.preventDefault(); e.target.click(); return; }
  const s = UI.rev.session; if (!s || s.done || UI.view !== 'reviser') return;
  if (e.key === 'Escape') { endSession(); return; }
  if (s.mode === 'flash') { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } else if (/^[1-4]$/.test(e.key)) { if (!s.flipped) flip(); else grade(+e.key); } }
  else { if (/^[1-4]$/.test(e.key) && s.chosen < 0 && s.opts[+e.key - 1] !== undefined) quizPick(+e.key - 1); else if ((e.key === 'Enter' || e.key === ' ') && s.chosen >= 0) { e.preventDefault(); nextCard(); } }
});
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); const z = e.target.closest && e.target.closest('#dz'); $$('.dropzone').forEach(d => d.classList.toggle('over', d === z)); }));
document.addEventListener('dragleave', e => { if (!e.relatedTarget) $$('.dropzone').forEach(d => d.classList.remove('over')); });
document.addEventListener('drop', e => { e.preventDefault(); $$('.dropzone').forEach(d => d.classList.remove('over')); if (e.target.closest && e.target.closest('#dz') && e.dataTransfer.files.length) ingest(e.dataTransfer.files[0]); });

/* ===== 16. Démarrage ===== */
window.Solstice = { generateLocal, groundFilter, formatTranscript, videoId, pdfLines, pdfRender, cleanImage, blocksFrom };
document.title = S.settings.name;
applyTheme();
{ const h = location.hash.slice(1), v = ALIAS[h] || h; if (VIEWS.includes(v)) UI.view = v; }
render();
})();
</script>
